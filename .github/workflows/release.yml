name: Instalador

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: npm ci

      - run: npm run build:sensor

      - run: npm test

      - run: npm run test:ui

      - run: npm run dist

      - name: Testar o instalador silencioso
        shell: pwsh
        timeout-minutes: 8
        run: |
          $setup = (Get-ChildItem dist/*.exe).FullName
          $install = Start-Process $setup -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "instalador saiu com $($install.ExitCode)" }
          $exe = Join-Path $env:ProgramFiles 'UltraGMonitor\UltraGMonitor.exe'
          if (-not (Test-Path $exe)) { throw "app não foi instalado em $exe" }
          $ocr = Join-Path $env:ProgramFiles 'UltraGMonitor\resources\ocr'
          foreach ($file in @('worker.cjs', 'ocr-image.js', 'ocr-result.js', 'languages\por.traineddata.gz', 'languages\eng.traineddata.gz', 'languages\spa.traineddata.gz', 'node_modules\pngjs\lib\png.js', 'node_modules\tesseract.js\src\index.js')) {
            if (-not (Test-Path (Join-Path $ocr $file))) { throw "arquivo de reconhecimento ausente no instalador: $file" }
          }
          $key = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\d5be0f81-9cb9-5e10-a442-364ab38f49a9'
          Write-Host "ProductCode ok: $($key.DisplayName) $($key.DisplayVersion)"
          if (-not (Get-ScheduledTask -TaskName UltraGMonitor -ErrorAction SilentlyContinue)) { throw 'tarefa de abrir com o Windows não foi criada' }
          $uninstall = Start-Process (Join-Path $env:ProgramFiles 'UltraGMonitor\Uninstall UltraGMonitor.exe') -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "desinstalador saiu com $($uninstall.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: UltraGMonitor-Setup
          path: dist/*.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Testar os sensores no Linux
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb > /dev/null
          xvfb-run -a npm run test:ui
          xvfb-run -a npx electron . --no-sandbox --smoke-test | tee smoke.txt
          grep -q '"platform":"linux"' smoke.txt
          grep -q '"cpu":{"name"' smoke.txt

      - run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: UltraGMonitor-Linux
          path: dist/*

  publicar:
    needs: [build, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          pattern: UltraGMonitor-*
          merge-multiple: true
          path: dist

      - name: Gerar notas a partir do changelog
        run: node scripts/release-notes.js "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "UltraGMonitor $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"

  winget:
    needs: publicar
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54
        with:
          identifier: PauloAzevedo.UltraGMonitor
          installers-regex: '-Setup\.exe$'
          release-tag: ${{ github.ref_name }}
          token: ${{ env.WINGET_TOKEN }}
