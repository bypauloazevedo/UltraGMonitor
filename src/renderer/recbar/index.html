<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'" />
    <title>UltraGMonitor · Gravando</title>
    <link rel="stylesheet" href="../shared/fonts.css" />
    <link rel="stylesheet" href="../shared/base.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
      }
      .bar {
        height: 100%;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 8px 0 14px;
        border-radius: 99px;
        background: rgba(12, 14, 19, 0.96);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
        color: #eef2f7;
        -webkit-app-region: drag;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #ff3b5c;
        animation: blink 1.2s ease-in-out infinite;
      }
      .paused .dot {
        background: #ffb547;
        animation: none;
      }
      .waiting .dot {
        background: #8d97a7;
      }
      #time {
        flex: 1;
        font: 600 14px var(--mono);
        letter-spacing: 0.02em;
      }
      button {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        color: #eef2f7;
        cursor: pointer;
        -webkit-app-region: no-drag;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.16);
      }
      #stop {
        background: #ff3b5c;
        color: #fff;
      }
      #stop:hover {
        filter: brightness(1.1);
      }
      svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #stop svg {
        fill: currentColor;
        stroke: none;
      }
      @keyframes blink {
        50% {
          opacity: 0.3;
        }
      }
    </style>
  </head>
  <body>
    <div class="bar waiting" id="bar">
      <i class="dot"></i>
      <span id="time">00:00</span>
      <button id="pause" title="Pausar"></button>
      <button id="stop" title="Parar e salvar">
        <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" /></svg>
      </button>
      <button id="cancel" title="Descartar">
        <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></svg>
      </button>
    </div>
    <script src="../shared/i18n.js"></script>
    <script src="recbar.js"></script>
  </body>
</html>
