<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:" />
    <title>UltraGMonitor · Últimos prints</title>
    <link rel="stylesheet" href="../shared/fonts.css" />
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="history.css" />
  </head>
  <body>
    <header>
      <h1>Últimos prints</h1>
      <div class="tools">
        <button class="ghost" data-folder="shots" title="Abrir a pasta dos prints">
          <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" /></svg>
          Prints
        </button>
        <button class="ghost" data-folder="videos" title="Abrir a pasta dos vídeos">
          <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" /></svg>
          Vídeos
        </button>
        <button class="close" id="close" title="Fechar (Esc)">
          <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></svg>
        </button>
      </div>
    </header>
    <main id="grid"></main>
    <div class="empty" id="empty" hidden>
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" /><circle cx="9" cy="11" r="2" /><path d="m21 17-5-5-9 7" /></svg>
      <strong>Nenhum print ainda</strong>
      <span>Os prints e vídeos que você fizer aparecem aqui.</span>
    </div>
    <footer>Clique pra copiar · arraste pra soltar em outro app · botão direito pra mais opções</footer>
    <script src="../shared/i18n.js"></script>
    <script src="../shared/theme.js"></script>
    <script src="history.js"></script>
  </body>
</html>
