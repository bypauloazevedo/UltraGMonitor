<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'" />
    <title>UltraGMonitor</title>
    <link rel="stylesheet" href="../shared/fonts.css" />
    <link rel="stylesheet" href="../shared/base.css" />
    <style>
      html,
      body {
        background: transparent;
        overflow: hidden;
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .toast {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 18px 11px 14px;
        border-radius: 14px;
        background: rgba(12, 14, 19, 0.96);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
        color: #eef2f7;
        font: 600 14px var(--font);
        white-space: nowrap;
        animation: pop 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .toast i {
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #39d98a;
        color: #071114;
      }
      .toast.error i {
        background: #ff5c5c;
      }
      .toast svg {
        width: 15px;
        height: 15px;
        fill: none;
        stroke: currentColor;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .toast small {
        font-weight: 500;
        color: #aeb7c4;
        margin-left: 4px;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.97);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="toast.js"></script>
  </body>
</html>
